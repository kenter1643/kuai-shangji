<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A63D6">
<meta name="description" content="快商机 — 覆盖全国34个省级行政区的招投标商机发现控制台">
<title>快商机 · 全国项目商机系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A63D6'/%3E%3Ctext x='32' y='45' font-size='40' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="web/style.css?v=20261031a">
<!-- 云服务配置：来自开通时返回的 publicConfig。publishableKey 只标识应用，
     本身不带权限（服务端按 Origin 精确匹配），所以放在前端是设计如此。 -->
<script>
  window.KSJ_CLOUD_CONFIG = {
    endpoint: "https://kuai-shangji.app.workbuddy.host",
    oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
    publishableKey: "wbpk_1pGKURuLJI8zDJEE6JKYyi_77zE0WZ554hZ041rq6131yA2BVnEV23g"
  };
</script>
</head>
<body>

<header class="hd">
  <div class="hd-top">
    <div class="logo">快</div>
    <div class="hd-name">
      <div class="brand">快<em>商机</em></div>
    </div>
    <div class="hd-dot"><i class="pulse"></i><span id="srcSt">采集中</span></div>
    <!-- 登录入口：未登录显示「登录」，登录后显示脱敏手机号，点开可退出 -->
    <button class="acct" id="acctBtn" type="button">登录</button>
  </div>
  <nav class="tabs" id="tabs">
    <div class="tab on" data-t="all">商机广场<small id="cAll">0</small></div>
    <div class="tab" data-t="招标公告">招标中<small id="cBid">0</small></div>
    <div class="tab" data-t="warn">机会预警<small id="cPre">0</small></div>
    <div class="tab" data-t="中标结果">中标结果<small id="cWin">0</small></div>
    <div class="tab" data-t="fav">我的收藏<small id="cFav">0</small></div>
    <div class="tab" data-t="rival">对手分析</div>
    <div class="tab" data-t="contacts">通讯录<small id="cCt">0</small></div>
    <div class="tab" data-t="ai">AI 匹配</div>
  </nav>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <!-- 筛选区：商机类视图共用。默认只露一条工具条，点击展开完整面板，
       把首屏留给列表（手机上一屏能看到更多商机） -->
  <section class="filter" id="filter">
    <!-- 用真正的 button：iOS Safari 对 div/span 上的 click 派发有历史坑，
         换成原生可点击元素后，点击与无障碍都交给浏览器，不再依赖 cursor:pointer 推断 -->
    <button class="fbar" id="fbar" type="button" aria-expanded="false" aria-controls="fpanel">
      <span class="fb-ico">⌕</span>
      <span class="fb-sum" id="fbSum">搜索 / 筛选</span>
      <span class="fb-badge" id="fbBadge" hidden>0</span>
      <span class="fb-caret">▾</span>
    </button>
    <!-- 展开由 .filter.open 控制（CSS 单一来源），不用 hidden 属性：
         Safari 在 sticky 容器里切 hidden 有时不重绘，表现为“点了没反应” -->
    <div class="fpanel" id="fpanel">
      <div class="srch">
        <span class="ico">⌕</span>
        <input id="kw" type="search" placeholder="搜项目名称 / 采购单位 / 代理机构" autocomplete="off">
        <button class="clr" id="clr" hidden>×</button>
      </div>
      <div class="chips" id="stages"></div>
      <div class="catbox">
        <div class="cathead">
          <span>行业分类 <b id="catHit">可多选</b></span>
          <span class="catbtns">
            <button class="catclr" id="catMore" type="button">展开全部</button>
            <button class="catclr" id="catClr" type="button">清空</button>
          </span>
        </div>
        <div class="chips flex" id="cats"></div>
      </div>
      <div class="selrow">
        <select id="selRegion"></select>
        <select id="selAmt"></select>
        <select id="selDay"></select>
      </div>
      <div class="selrow">
        <select id="selSource"></select>
      </div>
      <div class="fmeta">
        <span id="fcount">—</span>
        <span id="fsort">默认按发布时间排序</span>
      </div>
    </div>
  </section>

  <main id="main"></main>

  <div class="foot">    快商机 · 数据源
    <a href="http://www.ccgp.gov.cn/" target="_blank" rel="noopener">中国政府采购网</a> ·
    <a href="https://gdgpo.czt.gd.gov.cn/" target="_blank" rel="noopener">广东省政府采购智慧云平台</a><br>
    数据为国家法定发布平台公开信息，本项目仅做商机聚合与去重，不构成投标建议
  </div>
</div>

<nav class="nav">
  <div class="on" data-t="all"><span>◎</span>商机</div>
  <div data-t="warn"><span>⚑</span>预警</div>
  <div data-t="中标结果"><span>✓</span>中标</div>
  <div data-t="rival"><span>◫</span>对手</div>
  <div data-t="ai"><span>✦</span>匹配</div>
</nav>

<!-- 登录面板：手机号验证码登录。收藏与画像登录后存云端，换设备不丢 -->
<div class="auth-sheet" id="authSheet">
  <div class="auth-card">
    <div class="auth-hd">
      <span>登录 / 注册</span>
      <button class="auth-x" id="authClose" type="button" aria-label="关闭">×</button>
    </div>
    <p class="auth-tip" id="authTip">登录后，收藏的商机和企业画像会存到云端，换手机、清缓存都不会丢。</p>
    <label class="auth-fld">
      <input id="authPhone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="手机号">
    </label>
    <p class="auth-err" id="authPhoneErr"></p>
    <label class="auth-fld auth-fld-code">
      <input id="authCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码">
      <button class="auth-send" id="authSend" type="button">获取验证码</button>
    </label>
    <p class="auth-err" id="authErr"></p>
    <button class="auth-submit" id="authSubmit" type="button">登录 / 注册</button>
    <div class="auth-signed" id="authSigned" hidden>
      <p id="authSignedWho"></p>
      <button class="auth-out" id="authOut" type="button">退出登录</button>
    </div>
  </div>
</div>

<!-- 轻提示：云端同步失败、登录结果等都走这里 -->
<div class="toast" id="toast" hidden></div>

<!-- 公告详情抽屉：点卡片标题打开，正文与结构化信息按需加载 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-hd">
    <span id="shClose" class="sh-x">×</span>
    <span class="sh-t">公告详情</span>
    <a id="shLink" class="sh-src" href="#" target="_blank" rel="noopener">查看原文 ↗</a>
  </div>
  <div class="sheet-bd" id="shBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="web/cloud.js?v=20261031a"></script>
<script src="web/store.js?v=20261031a"></script>
<script src="web/app.js?v=20261031a"></script>
</body>
</html>
